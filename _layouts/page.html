---
layout: default
---
<header class="page-hero">
  <p class="eyebrow">// {{ page.eyebrow | default: 'page' }}</p>
  <h1 data-split>{{ page.title }}</h1>
  {% if page.standfirst %}<p class="standfirst">{{ page.standfirst }}</p>{% endif %}
</header>
{% if page.fullwidth %}
{{ content }}
{% else %}
<div class="page-body">{{ content }}</div>
{% endif %}
