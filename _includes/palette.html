{%- comment -%}
  Terminal command palette. Opened via Cmd/Ctrl+K or the header search link.
  Without JS the header link degrades to /search/, a static full index.
{%- endcomment -%}
<div class="palette-backdrop" id="palette-backdrop" hidden>
  <div class="palette" role="dialog" aria-modal="true" aria-label="Search posts">
    <div class="palette-line">
      <span class="palette-prompt" aria-hidden="true">&gt;</span>
      <input class="palette-input" id="palette-input" type="text" role="combobox"
             aria-expanded="true" aria-controls="palette-results" aria-autocomplete="list"
             autocomplete="off" autocapitalize="off" spellcheck="false"
             placeholder="search posts_" aria-label="Search posts">
      <kbd class="palette-esc" aria-hidden="true">esc</kbd>
    </div>
    <ul class="palette-results" id="palette-results" role="listbox" aria-label="Search results"></ul>
    <p class="palette-hint" aria-hidden="true"><span>&#8593;&#8595;</span> navigate &nbsp;&middot;&nbsp; <span>&#9166;</span> open &nbsp;&middot;&nbsp; <span>esc</span> close</p>
  </div>
</div>
