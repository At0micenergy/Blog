<header class="header">
  <div class="container">
    <div class="row">
      <div class="col col-12">
        <div class="header-box">
          <div class="logo-title">
            <a href="{{site.baseurl}}/" class="logo-text">At0micenergy</a>
          </div>

          <nav id="site-navigation" class="nav-menu" aria-label="Main navigation">
            <button type="button" class="menu-close icon-button" aria-label="Close menu">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" /></svg>
            </button>
            <ul class="menu-list">
              <li class="menu-item"><a href="{{site.baseurl}}/" class="menu-link">Home</a></li>
              {% for page in site.pages %}
                {% unless page.name == 'tags.html' or page.name == '404.html' %}
              {% if page.title %}
              <li class="menu-item"><a href="{{ page.url | prepend: site.baseurl }}" class="menu-link">{{ page.title }}</a></li>
              {% endif %}
                {% endunless %}
              {% endfor %}
              <li class="menu-item"><a href="{{ '/tags/' | relative_url }}" class="menu-link">Topics</a></li>
            </ul>
          </nav>
          <div class="nav-buttons">
            <button type="button" class="menu-button d-hide icon-button" aria-label="Open menu" aria-controls="site-navigation" aria-expanded="false">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" /></svg>
            </button>
            <button type="button" class="search-button icon-button" aria-label="Search writeups" aria-controls="site-search" aria-expanded="false">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="10" r="6" /><path d="m15 15 5 5" /></svg>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div id="site-search" class="search" role="dialog" aria-modal="true" aria-label="Search writeups" hidden>
    <div class="search-box">
      <button type="button" class="search-close-button icon-button" aria-label="Close search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" /></svg>
      </button>
      <label for="js-search-input" class="screen-reader-text">Search writeups by title or topic</label>
      <input type="search" id="js-search-input" class="search-text" autocomplete="off" placeholder="Search writeups...">
      <ol id="js-results-container" class="search-results-list" aria-live="polite"></ol>
    </div>
  </div>
</header> <!-- /.header -->
