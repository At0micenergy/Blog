title: "The control set the incident argues for"
desc: "Six controls, layered at and around the write path: screen every rule before it is persisted so no secret is stored verbatim, persist patterns instead of commands, make standing approvals reviewable and expiring, move the file's ignore entry into the project's own .gitignore so the protection travels, put the agent's own files on its do-not-commit list, and scan for passwords inside commands rather than only for key shapes."
