ascii: |
  THE CONTROL SET THE INCIDENT ARGUES FOR

    1. Screen the write
       no secret is ever persisted verbatim
    2. Patterns, not commands
       persist the decision - discard the content
    3. Reviewable, expiring rules
       standing approvals a user can see and revoke
    4. Privacy that travels
       the project's own .gitignore - not one machine's
    5. Agent commit hygiene
       the agent's own files on its do-not-commit list
    6. Command-aware scanning
       catch passwords inside commands, not just key shapes

  Persist the decision. Discard the content.
