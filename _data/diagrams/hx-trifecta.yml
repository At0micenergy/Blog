title: "The lethal trifecta"
desc: "Simon Willison's lethal trifecta: an agent that can reach private data, takes in untrusted content, and can communicate outward. When all three are true at once, a single piece of planted content can in principle walk the private data out. All three legs are properties of the harness, not the model."
