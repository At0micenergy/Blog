ascii: |
  LLM TOP 10 2026 (grades the component)     AGENTIC TOP 10 2026 (grades the actor)

  Input    --\
  Context  ---+--> Model                     Tools     <-- Policy gate
  Output   --/                               Identity
                                             Memory    <-- Observation
                                             Downstream <-- Tool executes

  Center, the Blog 2 agent loop:
  User goal -> Orchestrator -> Model -> Policy gate -> Tool -> Observation -> (next turn)

  The seam runs through the policy gate. On one side the model is a
  component inside an application; on the other it is an actor whose
  calls execute. Each list grades its own side of the gate.
