title: "The verification loop"
desc: "How the fix would be verified on paper: replay the original scenario and its variants against the controls, read the evidence from the audit log and the store, compare the agent's account against that record, and file any mismatch as a finding before replaying again."
width: 960
height: 540
nodes:
  - id: scenario
    x: 60
    y: 60
    w: 300
    h: 64
    label: "Replay the scenario"
    sub: "the original incident, then variants"
    kind: entry
  - id: controls
    x: 600
    y: 60
    w: 300
    h: 64
    label: "Controls under test"
    sub: "gate - freeze - approval - limits"
  - id: evidence
    x: 600
    y: 270
    w: 300
    h: 64
    label: "Evidence"
    sub: "audit log + store state"
  - id: compare
    x: 60
    y: 270
    w: 300
    h: 64
    label: "Compare and file"
    sub: "agent report vs the record"
  - id: finding
    x: 330
    y: 420
    w: 300
    h: 56
    label: "Mismatch = a finding"
    sub: "filed in its own right"
edges:
  - x1: 364
    y1: 92
    x2: 596
    y2: 92
    label: "run the tests"
  - d: "M 750 128 V 266"
    label: "read what actually happened"
    label_x: 738
    label_y: 200
    label_anchor: end
  - x1: 596
    y1: 302
    x2: 364
    y2: 302
    label: "check the pass criteria"
  - d: "M 210 270 V 128"
    label: "fix, then replay"
    label_x: 222
    label_y: 200
    label_anchor: start
  - d: "M 210 338 V 447 H 326"
    kind: warn
    label: "any mismatch"
    label_x: 222
    label_y: 398
    label_anchor: start
labels:
  - x: 60
    y: 516
    text: "PASS = VISIBLE DENIAL, BOUNDED FAILURE, OR SAFE FALLBACK"
ascii: |
  Replay the scenario -> Controls under test -> Evidence (log + store)
        ^                                                |
        |                                                v
        +------- fix, then replay <- Compare and file <-+

  Any mismatch between the agent's report and the record is filed as a
  finding in its own right. A pass is a visible denial, a bounded
  failure, or a safe fallback - never the agent's word that it behaved.
