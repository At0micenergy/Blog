labels:
  - x: 40
    y: 335
    text: "THE MODEL PROPOSES. THE HARNESS DISPOSES."
ascii: |
  Your request -> Context assembled -> Model proposes
   (fix the          (instructions,       (run the
    failing test)      code, test output)   test suite)
                                                 |
                                          proposed action
                                                 v
  Result returns <- Tool executes <- Permission check
   (output joins      (the command        (run freely,
    the context)        actually runs)      ask, or refuse)
        |
        +-- the loop repeats, until the tests pass
            or a limit the harness set says stop.

  Five of the six steps are the harness. The model
  supplies judgment inside a process it does not control.

  The model proposes. The harness disposes.
