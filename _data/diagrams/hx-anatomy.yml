title: "One job, inside the loop"
desc: "The agent loop for one ordinary task, fixing a failing test: the request arrives, the harness assembles the context, the model proposes an action, the harness checks permission, the tool executes, and the result returns into the context for the next round. Only one of the six steps is the model; the other five are the harness."
