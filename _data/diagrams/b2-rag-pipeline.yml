labels:
  - x: 80
    y: 92
    text: "// INDEXING - offline"
  - x: 80
    y: 252
    text: "// QUERY - online"
  - x: 320
    y: 352
    text: "apply the user's permission filter BEFORE retrieval, not after"
  - x: 80
    y: 420
    text: "Citation integrity: every claim points to the exact passage it came from."
  - x: 80
    y: 444
    text: "If retrieval finds nothing relevant, the agent says so - never fills the gap from memory."
  - x: 80
    y: 468
    text: "Retrieved text is DATA. It never becomes instruction, no matter how it is phrased."
ascii: |
  [offline] Documents -> Parse -> Chunk (~512 tokens) -> Embed -> Vector index
  [online]  User query -> Retrieve (top-k=3, permission filter FIRST)
          -> Passages -> Inject into context -> Answer + citations
