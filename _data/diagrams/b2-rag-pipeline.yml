title: "Retrieval pipeline"
desc: "Documents are parsed, chunked, embedded, and indexed offline; at query time the top matches are retrieved, injected into context, and answered with passage-level citations. The corpus is untrusted until proven otherwise, and permission filters run before retrieval."
width: 960
height: 600
