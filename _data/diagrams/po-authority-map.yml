ascii: |
  Staging task -> Cursor agent -> Unrelated file
                                       |
                                  found and used
                                       v
  Production volume <- Railway API <- Root-scoped token

  WITHIN THE TOKEN'S REACH: the token, the API, the production
  volume, and the volume's backups - one scope covered all of it.

  Outside that reach: Railway's offsite disaster-recovery backups,
  which no customer token could touch - and which saved the company.

  The boundary that mattered was not staging vs production.
  It was the token's scope.
