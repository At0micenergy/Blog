title: "Where the authority sat"
desc: "The PocketOS system in April 2026: a staging task, an agent that could read beyond its task, and a root-scoped Railway token sitting in an unrelated file. Everything the token could reach - the API, the production volume, and the volume's backups - sat inside one scope; the backups that saved the company sat outside it."
