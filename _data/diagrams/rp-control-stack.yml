labels:
  - x: 40
    y: 600
    text: "EVERY CONTROL SITS BETWEEN PROPOSAL AND EXECUTION"
ascii: |
  Agent proposes
     |
     v
  AUTHORIZATION LAYER
    1. Identity + environment: no production handle
    2. Freeze state: checked on every mutation
    3. Destructive-action class: deny by default
    4. Human approval: system-rendered, out-of-band
     |
     v  (permitted operations only)
  Platform executes -> Development store
                    -> Production store (by deployment, never by the agent)

  Underneath: blast-radius limits (row caps, soft-delete, tested restore)
  and an audit log the agent cannot write.
