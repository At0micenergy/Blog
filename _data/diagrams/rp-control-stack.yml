title: "The control set as one system"
desc: "The six controls the incident argues for, arranged on the execution path: an authorization layer between the model's proposal and the platform's execution, holding identity and environment separation, freeze state, the destructive-action class, and human approval, with blast-radius limits on what executes and an audit log the agent cannot write."
