title: "Agent architecture: orchestrator, model, tools"
desc: "The full agent architecture from section 3. A user goal reaches the orchestrator runtime, which drives the model with current context and tool specs. The model either answers directly or passes a policy and approval gate before a tool implementation runs; the observation returns to context and the loop continues."
