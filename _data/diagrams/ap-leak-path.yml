  Command proposed -> Developer approval -> settings.local.json
   (credential in        (yes, and don't      (the rule saved
    the line)             ask again)           word for word)
                                                    |
                                             carried into the repo
                                                    v
  History and forks <- Public GitHub <- Commit
   (deletion does       (104,185 copies)  (Claude co-authored
    not recall it)                          539 of 1,105 traced)

  PUBLIC, AND EFFECTIVELY PERMANENT: the commit, the public
  repositories, and their history and forks - 1,122 of the
  files held a real secret.

  Beside that path: the standard secret scanners, which
  flagged only part of the exposure - 215 of the 1,122
  secret-bearing files were flagged by neither gitleaks
  nor TruffleHog.

  The approval was momentary. The record was permanent.
