title: "How an approval became a public secret"
desc: "The leak path: a shell command carrying a credential is approved once with 'don't ask again', the full command is saved word for word as an allow rule in .claude/settings.local.json, and the file is committed - in 539 of 1,105 traced repositories by a commit Claude co-authored - into public GitHub repositories, where history and forks keep it after deletion, and where standard secret scanners missed 215 of the 1,122 secret-bearing files."
