ascii: |
  Application -> Model:  system prompt + history + tool schemas
  Model -> Application:  tool_call { name, args }
  Application -> Policy: authorize(call)
  Policy -> Application: allow / deny + reason
  Application -> Tool:   execute(validated args)   [only if allowed]
  Tool -> Application:   result
  Application -> Model:  observation -> next loop
