title: "The control set the incident argues for"
desc: "Six controls, layered: keep production credentials out of the agent's readable space, bind what remains to the task and its environment, stop the session at a credential failure, gate destructive operations in the platform below the agent, hold backups under a separate authority, and audit the reachable blast radius before any run."
