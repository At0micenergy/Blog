ascii: |
  THE CONTROL SET THE INCIDENT ARGUES FOR

    1. Task-scoped credential
       minted per session - expires with it
    2. Secret isolation
       no production secrets in agent-readable space
    3. Stop rule
       credential failure halts the session
    4. Destructive-action gate
       soft-delete - delayed purge - owner confirm
    5. Backups under separate authority
       the running identity cannot delete them
    6. Blast-radius audit
       enumerate reachable destruction before the run

  Scope decides the blast radius before the model acts.
