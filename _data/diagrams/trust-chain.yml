title: "Threat-modeling chain: trace the trust escalation"
desc: "Use this chain when threat-modeling an agent. Trust escalates downward: untrusted input becomes model-visible context, which shapes model-generated decisions. The policy decision is the enforcement point before anything credentialed happens. Red marks the attacker-influenced zone; amber marks the trust boundary."
width: 440
height: 640
direction: vertical
bounds:
  - x: 78
    y: 14
    w: 284
    h: 240
    label: "attacker-influenced"
    kind: danger
  - x: 78
    y: 268
    w: 284
    h: 78
    label: "trust boundary"
    kind: warn
nodes:
  - id: input
    x: 100
    y: 44
    w: 240
    h: 50
    label: "Untrusted input"
    kind: entry
  - id: context
    x: 100
    y: 122
    w: 240
    h: 50
    label: "model-visible context"
  - id: decision
    x: 100
    y: 200
    w: 240
    h: 50
    label: "model-generated"
    sub: "decision"
  - id: policy
    x: 100
    y: 282
    w: 240
    h: 50
    label: "policy decision"
    kind: gate
  - id: tool
    x: 100
    y: 386
    w: 240
    h: 50
    label: "credentialed tool"
  - id: effect
    x: 100
    y: 464
    w: 240
    h: 50
    label: "external effect"
  - id: memory
    x: 100
    y: 542
    w: 240
    h: 50
    label: "stored observation"
    sub: "or memory"
edges:
  - from: input
    to: context
  - from: context
    to: decision
  - from: decision
    to: policy
    kind: warn
  - from: policy
    to: tool
  - from: tool
    to: effect
  - from: effect
    to: memory
ascii: |
  Untrusted input
      -> model-visible context
      -> model-generated decision
      -> policy decision
      -> credentialed tool
      -> external effect
      -> stored observation or memory
