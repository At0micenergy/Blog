labels:
  - x: 120
    y: 545
    text: "Every arrow crossing a zone boundary needs: authentication, authorization, validation, a log entry."
  - x: 120
    y: 575
    text: "The model proposes. The application disposes. Nothing privileged moves on the model's word alone."
  - x: 120
    y: 605
    text: "Ask per boundary: who controls this input? what authority crosses? what validates it? what proves it?"
ascii: |
  [UNTRUSTED] User input / Retrieved docs / Tool outputs / Web content
        | identity?      | provenance?      | data != instruction
        v                v                  v
  [AGENT] Orchestrator -> Model -> Policy gate -> State/memory, Audit log
        | scoped token        | allowlist
        v                     v
  [PRIVILEGED] Tools / Secrets (model never sees) / Side effects / Write paths
