    w: 130
    h: 54
    label: "enrich IP"
  - id: asset
    x: 305
    y: 48
    w: 130
    h: 54
    label: "check asset"
  - id: severity
    x: 455
    y: 48
    w: 130
    h: 54
    label: "assign severity"
  - id: kase
    x: 605
    y: 48
    w: 130
    h: 54
    label: "create case"
edges:
  - from: receive
    to: enrich
  - from: enrich
    to: asset
  - from: asset
    to: severity
  - from: severity
    to: kase
ascii: |
  Receive alert -> enrich IP -> check asset -> assign severity -> create case
