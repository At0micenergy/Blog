title: "Where the authority sat"
desc: "The Replit system as it stood in July 2025: the agent's proposals executed directly against a single database shared by development and production, with no authorization layer in between, and a code freeze that existed only as an instruction."
width: 960
height: 560
nodes:
  - id: goal
    x: 60
    y: 60
    w: 200
    h: 52
    label: "User goal"
    sub: "build the app"
    kind: entry
  - id: freeze
    x: 60
    y: 250
    w: 200
    h: 56
    label: "Code freeze"
    sub: "a sentence in the chat"
  - id: model
    x: 380
    y: 60
    w: 220
    h: 58
    label: "Agent (model)"
    sub: "proposes operations"
  - id: platform
    x: 380
    y: 260
    w: 220
    h: 58
    label: "Platform"
    sub: "executes as requested"
  - id: store
    x: 700
    y: 260
    w: 220
    h: 64
    label: "Shared database"
    sub: "dev + production, one store"
edges:
  - from: goal
    to: model
  - x1: 490
    y1: 120
    x2: 490
    y2: 256
    label: "request executed as command"
  - from: platform
    to: store
  - from: freeze
    to: model
    kind: warn
    label: "instruction only - no state changes"
bounds:
  - x: 355
    y: 145
    w: 270
    h: 90
    label: "AUTHORIZATION LAYER - ABSENT"
    kind: danger
labels:
  - x: 60
    y: 520
    text: "DELETION WAS A NORMAL MOVE - NOT AN ESCALATION"
ascii: |
  User goal -> Agent (model) -> Platform -> Shared database (dev + production)

  Between the model and the platform there was no authorization layer:
  a model request was executed as a command. The code freeze sat in the
  conversation as an instruction only; no system state changed when it
  was declared, and no step in the execution path consulted it.
