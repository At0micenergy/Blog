---
layout: page
title: Tags
permalink: /tags/
eyebrow: taxonomy
standfirst: Every label I've filed a note under. Pick one and fall down the rabbit hole.
fullwidth: true
---
<div class="wrap" style="padding-bottom: var(--section-gap);">
  <div class="tag-cloud">
    {% for tag in site.tags %}
    <a class="filter-btn" href="{{ tag[0] | slugify | prepend: '/tags/' | append: '/' | relative_url }}">{{ tag[0] }} <span class="count">{{ tag[1] | size }}</span></a>
    {% endfor %}
  </div>
</div>
